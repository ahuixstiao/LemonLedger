events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 前端是单页应用：入口 HTML + 带 hash 的静态资源
    # 规则要点：
    # 1) index.html 绝不能缓存（no-store），否则浏览器会拿着旧 HTML 去找已经删掉的旧 hash 文件；
    # 2) /assets/ 下的文件不存在时必须真 404，不能再回落到 index.html，
    #    否则浏览器会把 HTML 当成 JS 模块解析，页面直接白屏（很难查）；
    # 3) 带 hash 的文件缓存 30 天，新版本靠文件名变化失效。
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain application/javascript text/css application/json image/svg+xml;
        gzip_min_length 1k;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://lemonledger:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

#        location /adminer/ {
#            proxy_pass http://adminer:8080/;
#        }
    }
}
