services:
  lemonledger:
    image: 794862853/lemonledger:2.2
    container_name: lemonledger_container
    expose:
      - "8080"  # 内部端口
    environment:
      SPRING_PROFILES_ACTIVE: db,common
      # 同一 docker 网络内用服务名 mysql 解析，不再依赖 host.docker.internal
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ledger?useUnicode=true&serverTimezone=GMT%2B8&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-jeesite}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - my_network
    restart: always
    
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    # 仅绑定到宿主机局域网 IP，避免公网暴露；在 .env 中设置 MYSQL_BIND_IP
    ports:
      - "${MYSQL_BIND_IP:-127.0.0.1}:3306:3306"
    expose:
      - "3306"  # 同一 docker 网络内的服务可通过 mysql:3306 访问
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ledger
      # 复用 Spring 的数据源用户名/密码，保证 MySQL 侧和 lemonledger 侧一致
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-jeesite}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-conf:/etc/mysql/conf.d
      - ./mysql-log:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my_network
    restart: always
  
  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "8080:80"  # 外部访问端口
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ledger-view/dist:/usr/share/nginx/html  # 前端打包文件
    depends_on:
      - lemonledger
    networks:
      - my_network
    restart: always

networks:
  my_network:
    name: lemonledger_network
    driver: bridge